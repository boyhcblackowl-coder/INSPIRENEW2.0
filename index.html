<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0D0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="INSPIRE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="INSPIRE - The Digital Home of sOWLdiers">
<title>INSPIRE</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">

<style>
:root{
  --black:#0C0D0F;
  --black2:#16181B;
  --gold:#D7B97C;
  --gold2:#B89350;
  --cream:#F8F4EB;
  --muted:#BEB5A3;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--black);font-family:Arial,sans-serif;color:white}
body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:calc(24px + var(--safe-top)) 18px calc(24px + var(--safe-bottom));
  background:
    radial-gradient(circle at 50% 10%, rgba(215,185,124,.16), transparent 34%),
    linear-gradient(180deg,var(--black),var(--black2));
}
.shell{width:min(420px,100%);text-align:center}
.logo{width:118px;height:118px;object-fit:contain;display:block;margin:0 auto 12px}
.brand{font-size:26px;font-weight:900;letter-spacing:.24em;margin-left:.24em}
.tagline{font-size:12px;color:#CDBE9C;margin-top:8px}
.loader{width:30px;height:30px;margin:25px auto 0;border:3px solid rgba(215,185,124,.22);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status{font-size:12px;color:var(--muted);margin-top:15px;line-height:1.45;min-height:34px}
.actions{display:none;margin-top:20px}
.actions.show{display:block}
.btn{
  display:block;width:100%;border:0;border-radius:13px;padding:13px 14px;margin-top:9px;
  text-decoration:none;font-size:13px;font-weight:800
}
.btn.primary{background:var(--gold);color:var(--black)}
.btn.secondary{background:#26282B;color:#fff;border:1px solid rgba(215,185,124,.20)}
.diagnostic{display:none;margin-top:22px;padding-top:18px;border-top:1px solid rgba(215,185,124,.18)}
.diagnostic.show{display:block}
.diagnostic p{font-size:11px;color:#AFA694;line-height:1.5;margin:0 0 10px}
.account-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.account-grid a{
  text-decoration:none;background:#202226;color:#E6DCC8;border:1px solid rgba(215,185,124,.18);
  padding:10px 4px;border-radius:10px;font-size:11px;font-weight:800
}
.version{font-size:9px;color:#716B60;margin-top:24px;letter-spacing:.08em}
</style>
</head>
<body>
<main class="shell">
  <img class="logo" src="icons/icon-192.png" alt="Black Owl">
  <div class="brand">INSPIRE</div>
  <div class="tagline">The Digital Home of sOWLdiers</div>
  <div class="loader" id="loader"></div>
  <div class="status" id="status">Opening INSPIRE…</div>

  <div class="actions" id="actions">
    <a class="btn primary" id="openDirect" href="https://script.google.com/macros/s/AKfycbzsW1cYUPoJwd2R1xUDbSxFE6QM_qFsGyL4eYYGDwLtN5NtXa3EGe3vYz5wrPryAbIjCA/exec">Open INSPIRE</a>
    <button class="btn secondary" id="showDiag" type="button">Still having trouble?</button>
  </div>

  <section class="diagnostic" id="diagnostic">
    <p>If Chrome has multiple Google accounts signed in, try the account context below. This is only for troubleshooting.</p>
    <div class="account-grid">
      <a href="https://script.google.com/macros/s/AKfycbzsW1cYUPoJwd2R1xUDbSxFE6QM_qFsGyL4eYYGDwLtN5NtXa3EGe3vYz5wrPryAbIjCA/exec?authuser=0">Account 0</a>
      <a href="https://script.google.com/macros/s/AKfycbzsW1cYUPoJwd2R1xUDbSxFE6QM_qFsGyL4eYYGDwLtN5NtXa3EGe3vYz5wrPryAbIjCA/exec?authuser=1">Account 1</a>
      <a href="https://script.google.com/macros/s/AKfycbzsW1cYUPoJwd2R1xUDbSxFE6QM_qFsGyL4eYYGDwLtN5NtXa3EGe3vYz5wrPryAbIjCA/exec?authuser=2">Account 2</a>
    </div>
  </section>

  <div class="version">INSPIRE PWA WRAPPER V2 · REDIRECT MODE</div>
</main>

<script>
const APP_URL = "https://script.google.com/macros/s/AKfycbzsW1cYUPoJwd2R1xUDbSxFE6QM_qFsGyL4eYYGDwLtN5NtXa3EGe3vYz5wrPryAbIjCA/exec";
const statusEl = document.getElementById('status');
const actions = document.getElementById('actions');
const loader = document.getElementById('loader');
const diagnostic = document.getElementById('diagnostic');

document.getElementById('showDiag').addEventListener('click', () => {
  diagnostic.classList.toggle('show');
});

function launch() {
  statusEl.textContent = 'Opening INSPIRE in the browser…';

  // Important: top-level navigation only. No iframe.
  // replace() keeps the Back button from bouncing endlessly between launcher and app.
  window.location.replace(APP_URL);
}

// Give the branded splash enough time to render.
setTimeout(launch, 900);

// If browser blocks/interferes with navigation, surface manual controls.
setTimeout(() => {
  loader.style.display = 'none';
  actions.classList.add('show');
  statusEl.textContent = 'If INSPIRE did not open automatically, tap the button below.';
}, 5000);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
